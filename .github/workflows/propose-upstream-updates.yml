name: Propose upstream updates

on:
  schedule:
    - cron: "0 20 * * *" # JST 5:00 AM every day
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: propose-upstream-updates-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    # The canonical repository must never create a PR from itself.
    if: github.repository != 'ogatomo21/google-analytics-adsense-remote-mcp'
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: main
      SYNC_BRANCH: chore/sync-upstream
      UPSTREAM_REPOSITORY: ogatomo21/google-analytics-adsense-remote-mcp
      UPSTREAM_BRANCH: main
    steps:
      - name: Check out this deployed copy
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Merge available upstream changes
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"
          git switch --create "${SYNC_BRANCH}" "origin/${BASE_BRANCH}"

          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge --no-ff --no-edit "upstream/${UPSTREAM_BRANCH}"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Push the synchronization branch
        if: steps.merge.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${SYNC_BRANCH}" || true
          git push --force-with-lease origin "${SYNC_BRANCH}"

      - name: Create or update the review pull request
        if: steps.merge.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing_pr="$(gh pr list --base "${BASE_BRANCH}" --head "${SYNC_BRANCH}" --state open --json number --jq '.[0].number')"
          if [[ -z "$existing_pr" ]]; then
            gh pr create \
              --base "${BASE_BRANCH}" \
              --head "${SYNC_BRANCH}" \
              --title "chore: sync upstream updates" \
              --body "Automated proposal from ${UPSTREAM_REPOSITORY}@${UPSTREAM_BRANCH}. Review conflicts and Cloudflare-specific configuration before merging."
          fi
